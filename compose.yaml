services:
  app:
    build:
      context: .
      args:
        BASE_URL: ${BASE_URL:?Set BASE_URL in the root .env file}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: ${TRUST_PROXY:-}
    restart: unless-stopped
    stop_grace_period: 15s
